spring:
  application:
    name: aqs-crm

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aqs_crm}
    username: ${SPRING_DATASOURCE_USERNAME:aqs_user}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: ${APP_TIMEZONE:Asia/Kolkata}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  mail:
    host: ${SPRING_MAIL_HOST:smtpout.secureserver.net}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:noreply@yourdomain.com}
    password: ${SPRING_MAIL_PASSWORD:changeme}
    protocol: ${SPRING_MAIL_PROTOCOL:smtp}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:false}
          ssl:
            enable: ${SPRING_MAIL_SSL_ENABLE:true}
          timeout: 10000
          connectiontimeout: 10000
          writetimeout: 10000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:aqs-po-documents}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  mail:
    from: ${SPRING_MAIL_FROM:noreply@yourdomain.com}
  scheduler:
    reminders-cron: "${REMINDERS_CRON:0 0 9 * * ?}"

logging:
  level:
    root: INFO
    com.aqs.crm: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.flywaydb: INFO
